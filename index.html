<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/index.css" />
  </head>
  <body>
    <!-- Subtle Ambient Noise Texture -->
    <div id="noise-overlay" aria-hidden="true"></div>

    <!-- Soft Radial Cursor Lighting -->
    <div id="cursor-glow" aria-hidden="true"></div>

    <div id="app">
      <!-- Fixed Left Favorites Sidebar -->
      <aside id="favorites-sidebar" aria-label="Favorites Sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <span class="sidebar-label">FAVORITES</span>
            <span class="sidebar-count" id="favorites-count">0</span>
          </div>
          <button
            id="btn-add-favorite"
            class="icon-btn"
            title="Add Favorite (Ctrl+N)"
            aria-label="Add favorite"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <nav class="favorites-scroll-container">
          <ul id="favorites-list" class="favorites-list" role="list">
            <!-- Dynamically populated -->
          </ul>
        </nav>

        <div class="sidebar-footer">
          <span class="sidebar-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        </div>
      </aside>

      <!-- Centerpiece Hero: Clock, Date, Search -->
      <main id="hero-section">
        <!-- Faint Technical Radial Grid Structure -->
        <div id="radial-grid" aria-hidden="true"></div>

        <!-- Interactive Canvas Particle Clock -->
        <div id="clock-container" title="Hover over digits to scatter particles">
          <canvas id="clock-canvas"></canvas>
        </div>

        <!-- Understated Date Display -->
        <div id="date-display" aria-label="Current Date">
          <!-- e.g. MONDAY · OCTOBER 5 -->
        </div>

        <!-- Minimalist Integrated Search -->
        <div id="search-wrapper">
          <form id="search-form" action="https://www.google.com/search" method="GET">
            <div id="search-container">
              <span class="search-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input
                type="text"
                id="search-input"
                name="q"
                placeholder="Search the web or type a URL..."
                autocomplete="off"
                spellcheck="false"
                aria-label="Search the web"
              />
              <button
                type="button"
                id="search-clear-btn"
                class="search-clear-btn"
                aria-label="Clear search"
                tabindex="-1"
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              <div id="search-kbd-hint" class="search-kbd">
                <kbd id="kbd-meta">⌘</kbd><kbd>K</kbd>
              </div>
            </div>
          </form>
        </div>
      </main>

      <!-- Discreet Top-Right Utilities Toolbar -->
      <header id="top-toolbar">
        <button
          id="btn-toggle-format"
          class="toolbar-btn"
          title="Toggle 12h / 24h format (T)"
          aria-label="Toggle time format"
        >
          <span id="format-label">24H</span>
        </button>

        <button
          id="btn-toggle-seconds"
          class="toolbar-btn"
          title="Toggle seconds display (S)"
          aria-label="Toggle seconds"
        >
          <span id="seconds-label">SEC</span>
        </button>

        <button
          id="btn-toggle-sidebar"
          class="toolbar-btn"
          title="Toggle Sidebar (B)"
          aria-label="Toggle Sidebar"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>

        <button
          id="btn-open-shortcuts"
          class="toolbar-btn"
          title="Keyboard shortcuts (?)"
          aria-label="Keyboard shortcuts"
        >
          <span>?</span>
        </button>
      </header>

      <!-- Minimal Bottom Status indicator -->
      <footer id="status-bar">
        <div class="status-item">
          <span class="status-dot"></span>
          <span id="fps-counter" class="status-text">60 FPS</span>
        </div>
        <div class="status-item">
          <span id="particle-counter" class="status-text">0 PTS</span>
        </div>
      </footer>
    </div>

    <!-- Modal: Add / Edit Favorite -->
    <div id="favorite-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-heading">Add Favorite</h2>
          <button id="modal-close-btn" class="icon-btn" aria-label="Close dialog">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <form id="favorite-form">
          <input type="hidden" id="fav-id" value="" />
          <div class="form-group">
            <label for="fav-title" class="form-label">TITLE</label>
            <input
              type="text"
              id="fav-title"
              class="form-input"
              placeholder="e.g. GitHub"
              required
              maxlength="40"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="fav-url" class="form-label">URL</label>
            <input
              type="text"
              id="fav-url"
              class="form-input"
              placeholder="https://..."
              required
              autocomplete="off"
            />
          </div>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="modal-submit-btn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Keyboard Shortcuts Cheat Sheet -->
    <div id="shortcuts-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-card shortcuts-card">
        <div class="modal-header">
          <h2 class="modal-heading">Keyboard Shortcuts</h2>
          <button id="shortcuts-close-btn" class="icon-btn" aria-label="Close dialog">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="shortcuts-list">
          <div class="shortcut-row">
            <span class="shortcut-desc">Focus Search</span>
            <div class="shortcut-keys"><kbd id="sc-meta">⌘</kbd><kbd>K</kbd> / <kbd>/</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Dismiss Search / Close Modals</span>
            <div class="shortcut-keys"><kbd>Esc</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Navigate Favorites</span>
            <div class="shortcut-keys"><kbd>↑</kbd><kbd>↓</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Open Selected Favorite</span>
            <div class="shortcut-keys"><kbd>Enter</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Add New Favorite</span>
            <div class="shortcut-keys"><kbd>Ctrl</kbd><kbd>N</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Toggle 12h / 24h Clock</span>
            <div class="shortcut-keys"><kbd>T</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Toggle Seconds Display</span>
            <div class="shortcut-keys"><kbd>S</kbd></div>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-desc">Toggle Sidebar Rail</span>
            <div class="shortcut-keys"><kbd>B</kbd></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
